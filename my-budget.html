<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Privacy lock: this page is not allowed to load or send anything over the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>My Budget</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e4e7ec;--accent:#2563eb;--accent-soft:#e8efff;--good:#15803d;--bad:#dc2626;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--muted:#9aa0a6;--line:#2c313a;--accent:#60a5fa;--accent-soft:#1e2a40;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:14px 14px 4px}
header h1{font-size:20px;margin:0}
.badge{font-size:12px;color:var(--good);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--card)}
main{max-width:760px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .lbl{font-size:12px;color:var(--muted)}.stat .val{font-size:18px;font-weight:700;white-space:nowrap}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.monthbar h2{margin:0;font-size:18px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;border-radius:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.catrow{padding:8px 0;border-bottom:1px solid var(--line)}.catrow:last-child{border-bottom:0}
button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button.icon{padding:6px 12px;font-size:18px}
button.link{border:0;background:none;color:var(--accent);padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;width:42px;height:36px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label>input,label>select{margin-top:4px}
label.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
pre.summary{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 inherit;margin:10px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.txday{font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.tx{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:hover{background:var(--bg)}
.tx .d{flex:1;min-width:0}.tx .d div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:16px;width:min(460px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
.actions{display:flex;gap:8px;margin-top:14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td select{font-size:14px;padding:5px 6px}
tr.dup td{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:.92}
.budrow{display:grid;grid-template-columns:42px 1fr 120px 36px;gap:8px;align-items:center;margin-bottom:8px}
.budrow input{margin:0}
.histrow{display:grid;grid-template-columns:80px 1fr 90px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--accent);margin:6px 0}
.scroll{overflow-x:auto}
.rulerow{display:grid;grid-template-columns:1fr 150px 36px;gap:6px;align-items:center;margin-bottom:6px}
.rulerow input,.rulerow select{margin:0;font-size:14px;padding:6px 8px}
@media (max-width:420px){.stat .val{font-size:16px}.budrow{grid-template-columns:38px 1fr 100px 34px}.rulerow{grid-template-columns:1fr 120px 34px}}
</style>
</head>
<body>
<header><h1>My Budget</h1><span class="badge">🔒 Stored only on this device</span></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-view="overview"><span>📊</span>Overview</button>
  <button data-act="tab" data-view="tx"><span>🧾</span>Spending</button>
  <button data-act="tab" data-view="import"><span>📥</span>Import</button>
  <button data-act="tab" data-view="budget"><span>🎯</span>Budget</button>
  <button data-act="tab" data-view="settings"><span>⚙️</span>Settings</button>
</nav>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>
<input type="file" id="fileSync" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const STORE_KEY = 'mybudget.v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (n < 0 ? '-' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('en-US');
const now = () => Date.now();
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const curYm = () => todayStr().slice(0, 7);
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addMonths = (ym, k) => { let [y, m] = ym.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
const shortMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); };
const dayLabel = s => parseYmd(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const norm = s => String(s ?? '').normalize('NFKC').toUpperCase().replace(/\s+/g, ' ').trim();
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#9e9e9e';
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- defaults ---------- */
const DEFAULT_CATEGORIES = [
  ['Groceries','#43a047'],['Convenience stores','#7cb342'],['Dining out','#fb8c00'],['Transport','#1e88e5'],
  ['Housing','#6d4c41'],['Utilities','#00acc1'],['Phone & internet','#3949ab'],['Subscriptions','#8e24aa'],
  ['Shopping','#d81b60'],['Health','#e53935'],['Entertainment','#fdd835'],['Travel','#00897b'],
  ['Insurance','#546e7a'],['Education','#5e35b1'],['Other','#9e9e9e']
];
const DEFAULT_RULES = {
  'Groceries':['オオゼキ','京王ストア','フードショー','(食料品)','食品館','肉のハナマサ','イオン','AEON','イトーヨーカドー','ITO YOKADO','ライフ','西友','SEIYU','マルエツ','オーケー','業務スーパー','コープ','生協','成城石井','まいばすけっと','サミット','ヤオコー','ベルク','いなげや','東急ストア','スーパー','SUPERMARKET','コストコ','COSTCO'],
  'Convenience stores':['セブン-イレブン','セブンイレブン','セブン','SEVEN-ELEVEN','7-ELEVEN','ファミリーマート','FAMILYMART','ファミマ','ローソン','LAWSON','ミニストップ','MINISTOP','デイリーヤマザキ','セイコーマート','NEWDAYS'],
  'Dining out':['LUNCH','DINNER','BREAKFAST','COFFEE','ランチ','昼食','夕食','飲み会','外食','マクドナルド','MCDONALD','スターバックス','STARBUCKS','ドトール','DOUTOR','タリーズ','TULLY','コメダ','すき家','吉野家','松屋','ガスト','サイゼリヤ','ケンタッキー','KFC','モスバーガー','くら寿司','スシロー','はま寿司','UBER EATS','UBEREATS','出前館','WOLT','居酒屋','レストラン','RESTAURANT','カフェ','CAFE','珈琲','ラーメン','食堂','焼肉'],
  'Transport':['TRAIN','電車','バス代','GASOLINE','JR','SUICA','スイカ','PASMO','パスモ','メトロ','METRO','鉄道','電鉄','タクシー','TAXI','ENEOS','エネオス','出光','IDEMITSU','コスモ石油','ガソリン','ETC','駐車','パーキング','PARKING','タイムズ','UBER'],
  'Housing':['家賃','管理費','不動産','賃料','共益費'],
  'Utilities':['電力','TEPCO','電気','ガス','東京ガス','大阪ガス','水道','NHK','デンリョク','デンリヨク','トウキョウガス','オオサカガス','スイドウ'],
  'Phone & internet':['DOCOMO','ドコモ','KDDI','SOFTBANK','ソフトバンク','楽天モバイル','RAKUTEN MOBILE','ワイモバイル','Y!MOBILE','UQ','AHAMO','POVO','LINEMO','NURO','IIJ','MINEO','フレッツ','BIGLOBE','ビッグローブ'],
  'Subscriptions':['NETFLIX','SPOTIFY','AMAZON PRIME','アマゾンプライム','PRIME VIDEO','APPLE.COM','ITUNES','GOOGLE PLAY','GOOGLE ONE','YOUTUBE','DISNEY','U-NEXT','ABEMA','HULU','DAZN','ADOBE','MICROSOFT','OPENAI','CHATGPT','ANTHROPIC','CLAUDE.AI','DROPBOX','ICLOUD'],
  'Shopping':['AMAZON','アマゾン','楽天','RAKUTEN','ユニクロ','UNIQLO','ニトリ','無印','MUJI','ヨドバシ','YODOBASHI','ビックカメラ','BIC CAMERA','ヤマダ電機','ダイソー','DAISO','ドン・キホーテ','ドンキ','DON QUIJOTE','ZOZO','メルカリ','MERCARI','セリア','ロフト','LOFT','ハンズ','百貨店','三越','伊勢丹','高島屋','大丸','パルコ','ルミネ'],
  'Health':['MEDICINE','PHARMACY','DOCTOR','薬局','ドラッグ','DRUG','マツモトキヨシ','マツキヨ','ウエルシア','ツルハ','スギ薬局','サンドラッグ','ココカラファイン','病院','クリニック','CLINIC','HOSPITAL','歯科','医院','整骨','調剤'],
  'Entertainment':['映画','TOHO','シネマ','CINEMA','カラオケ','STEAM','NINTENDO','任天堂','PLAYSTATION','ゲーム','チケット','TICKET','ぴあ','イープラス','ローチケ'],
  'Travel':['MARRIOTT','マリオット','BONVOY','WESTIN','ウェスティン','SHERATON','シェラトン','RITZ','東横イン','アパホテル','ホテル','HOTEL','旅館','JAL','日本航空','全日空','AIRBNB','BOOKING.COM','楽天トラベル','じゃらん','JALAN','EXPEDIA','AGODA','新幹線','PEACH','ジェットスター','JETSTAR'],
  'Other':['HAIRCUT','美容院','美容室','床屋','ヘアカット','年会費','カード会費','ANNUAL FEE','MEMBERSHIP FEE'],
  'Insurance':['保険','生命','損保','損害','共済'],
  'Education':['書店','紀伊國屋','紀伊国屋','ジュンク堂','丸善','TSUTAYA','蔦屋','学校','スクール','SCHOOL','塾','UDEMY','KINDLE','英会話']
};

function defaultState() {
  const categories = DEFAULT_CATEGORIES.map(([name, color]) => ({ id: uid(), name, color, budget: 0 }));
  const byName = Object.fromEntries(categories.map(c => [c.name, c.id]));
  const rules = [];
  for (const [cat, kws] of Object.entries(DEFAULT_RULES)) for (const k of kws) rules.push({ id: uid(), keyword: norm(k), cat: byName[cat], builtin: true });
  return { version: 1, categories, transactions: [], recurring: [], rules, applied: {}, importMaps: {},
    settings: { weekStart: 1, summaryDay: 0, lastSummaryKey: '', lastBackup: '' }, contacts: [] };
}

/* ---------- storage ---------- */
let S;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); S = raw ? JSON.parse(raw) : defaultState(); }
  catch (e) { S = defaultState(); }
  const d = defaultState();
  for (const k of ['categories','transactions','recurring','rules']) if (!Array.isArray(S[k])) S[k] = d[k];
  S.applied = S.applied || {}; S.importMaps = S.importMaps || {}; S.tripMeta = S.tripMeta || {}; S.deleted = S.deleted || {}; if (!Array.isArray(S.debts)) S.debts = []; S.bank = S.bank || null; S.cards = S.cards || {}; if (!Array.isArray(S.contacts)) S.contacts = [];
  S.settings = Object.assign(d.settings, S.settings || {});
  // Add any built-in shop keywords introduced in newer versions (unless the user removed them).
  S.removedBuiltins = S.removedBuiltins || [];
  const have = new Set(S.rules.map(r => r.keyword)), byName = Object.fromEntries(S.categories.map(c => [c.name, c.id]));
  for (const [cat, kws] of Object.entries(DEFAULT_RULES)) for (const k of kws) {
    const kw = norm(k); if (have.has(kw) || S.removedBuiltins.includes(kw) || !byName[cat]) continue;
    S.rules.push({ id: uid(), keyword: kw, cat: byName[cat], builtin: true }); have.add(kw);
  }
}
function save() {
  S.savedAt = now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save in this browser — please export a backup.'); }
}

/* ---------- domain ---------- */
const UNCAT = { id: 'uncat', name: 'Uncategorized', color: '#bdbdbd', budget: 0 };
const WORK = { id: 'work', name: 'Work (reimbursable)', color: '#0284c7', budget: 0 };
const WORKLOSS = { id: 'workloss', name: 'Work costs not paid back', color: '#64748b', budget: 0 };
const TYPE_LABEL = { expense: 'Spending', income: 'Income', advance: 'Advance from work', reimb: 'Payment from work', return: 'Returned to work' };
const WORK_TYPES = ['advance', 'reimb', 'return'];
const catById = id => id === 'income' ? { id, name: 'Income', color: '#15803d', budget: 0 } : id === 'work' ? WORK : id === 'workloss' ? WORKLOSS : (S.categories.find(c => c.id === id) || UNCAT);
function catOptions(sel) {
  return `<option value="uncat"${sel === 'uncat' ? ' selected' : ''}>Uncategorized</option><option value="work"${sel === 'work' ? ' selected' : ''}>💼 Work (reimbursable)</option>` +
    S.categories.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
}
function categorize(desc) {
  const d = norm(desc); let best = null;
  for (const r of S.rules) {
    if (!r.keyword || !d.includes(r.keyword) || (r.cat !== 'work' && !S.categories.some(c => c.id === r.cat))) continue;
    if (!best || (best.builtin && !r.builtin) || (!!best.builtin === !!r.builtin && r.keyword.length > best.keyword.length)) best = r;
  }
  return best ? best.cat : 'uncat';
}
function addUserRule(keyword, cat) {
  keyword = norm(keyword); if (!keyword) return 0;
  const ex = S.rules.find(r => r.keyword === keyword && !r.builtin);
  if (ex) ex.cat = cat; else S.rules.push({ id: uid(), keyword, cat, builtin: false });
  let n = 0;
  for (const t of S.transactions) if (t.type === 'expense' && t.cat === 'uncat' && norm(t.desc).includes(keyword)) { t.cat = cat; t.u = now(); n++; }
  return n;
}
function applyRecurring() {
  const cym = curYm(), today = new Date().getDate(); let added = 0;
  for (const r of S.recurring) {
    if (!r.active) continue;
    let ym = r.startMonth || cym, guard = 0;
    while (ym <= cym && guard++ < 360) {
      const key = r.id + ':' + ym, day = Math.min(r.day || 1, daysInMonth(ym));
      if (!S.applied[key] && (ym < cym || day <= today)) {
        S.transactions.push({ id: `r_${r.id}_${ym}`, u: now(), date: `${ym}-${pad(day)}`, desc: r.desc, amount: +r.amount || 0, type: r.type,
          cat: r.type === 'income' ? 'income' : r.cat, source: 'recurring', account: r.account || '', note: '', recId: r.id });
        S.applied[key] = 1; added++;
      }
      ym = addMonths(ym, 1);
    }
  }
  if (added) save();
  return added;
}
function monthStats(ym) {
  let income = 0, spent = 0, work = 0, workIn = 0, perDiem = 0; const byCat = {}; const tx = [];
  for (const t of S.transactions) {
    if (!t.date.startsWith(ym)) continue; tx.push(t);
    if (t.type === 'income') income += t.amount;
    else if (t.type === 'advance' || t.type === 'reimb') workIn += t.amount;
    else if (t.type === 'return') workIn -= t.amount;
    else if (t.cat === 'work') work += t.amount;
    else { spent += t.amount; byCat[t.cat] = (byCat[t.cat] || 0) + t.amount; }
  }
  // A settled trip's leftover (money received beyond reported costs) is the per diem → income.
  // If work paid back less than reported, the gap is your own cost → spending.
  for (const tr of Object.values(tripStats())) {
    if (!tr.settled || !tr.settleDate.startsWith(ym) || !tr.balance) continue;
    if (tr.balance > 0) { income += tr.balance; perDiem += tr.balance; }
    else { spent -= tr.balance; byCat.workloss = (byCat.workloss || 0) - tr.balance; }
  }
  return { tx, income, spent, byCat, work, workIn, perDiem, saved: income - spent };
}
// Per trip: E = work spending, A = advances, P = payments from work, R = money returned to work.
function tripStats(excludeId) {
  const trips = {}, meta = S.tripMeta || {};
  for (const t of S.transactions) {
    if (t.id === excludeId) continue;
    const isW = t.type === 'expense' && t.cat === 'work';
    if (!isW && !WORK_TYPES.includes(t.type)) continue;
    const k = (t.trip || '').trim() || '(no trip name)';
    const tr = trips[k] || (trips[k] = { name: k, E: 0, A: 0, P: 0, R: 0, last: '', settleDate: '' });
    if (isW) tr.E += t.amount;
    else if (t.type === 'advance') tr.A += t.amount;
    else { if (t.type === 'reimb') tr.P += t.amount; else tr.R += t.amount; if (t.date > tr.settleDate) tr.settleDate = t.date; }
    if (t.date > tr.last) tr.last = t.date;
  }
  for (const tr of Object.values(trips)) {
    tr.marked = !!(meta[tr.name] && meta[tr.name].settled);
    if (!tr.settleDate && tr.marked) tr.settleDate = meta[tr.name].date;

  if (!name) { box.innerHTML = 'Pick the trip this belongs to and the app will do the maths.'; return; }
  const t = tripStats(MODAL && MODAL.id)[name] || { E: 0, A: 0, P: 0, R: 0 };
  const E = t.E, A = t.A + (type === 'advance' ? x : 0), P = t.P + (type === 'reimb' ? x : 0), R = t.R + (type === 'return' ? x : 0);
  const due = E - A - t.P + t.R, bal = A + P - R - E;
  let h = `Work spending reported: <b>${yen(E)}</b>`;
  if (t.A || type === 'advance') h += `<br>Advance${type === 'advance' ? ' (incl. this one)' : ''}: <b>${yen(A)}</b>`;
  if (t.P && type !== 'advance') h += `<br>Already paid by work: <b>${yen(t.P)}</b>`;
  if (type === 'advance') h += `<br>${A - E >= 0 ? `Left to spend: <b>${yen(A - E)}</b>` : `Over the advance by <b>${yen(E - A)}</b>`}`;
  else {
    h += `<br>Expenses still owed to you: <b>${yen(Math.max(0, due))}</b>`;
    if (x) h += bal > 0 ? `<br>➡️ Per diem in this ${type === 'reimb' ? 'payment' : 'settlement'}: <b class="good">${yen(bal)}</b> (counted as income)`
      : bal < 0 ? `<br>➡️ Work paid <b class="bad">${yen(-bal)}</b> less than you reported` : '<br>➡️ Exactly your expenses — no per diem';
  }
  box.innerHTML = h;
}

// Work out which card a statement is from, using its layout, any card name inside it, and the file name.
function detectCard(rows, det, fileName) {
  const top = rows.slice(0, Math.max(1, det.firstRow || 0)).flat().map(norm).join(' ');
  const hdr = det.header ? norm(det.header.join('|')) : '';
  const fn = norm(fileName);
  const named = (() => { for (const r of rows.slice(0, 8)) { const i = r.findIndex(c => /カード名称|カード名/.test(norm(c))); if (i >= 0 && r[i + 1]) return norm(r[i + 1]); } return ''; })();
  const all = [named, top, fn].join(' ');
  if (/タカシマヤ|高島屋|TAKASHIMAYA/.test(all)) return 'Takashimaya Card';
  if (/JAL/.test(all)) return 'JAL Card';
  if (/AMEX|アメリカン|AMERICAN EXPRESS|マリオット|MARRIOTT|BONVOY/.test(all)) return 'Amex';
  if (/楽天|RAKUTEN/.test(all)) return 'Rakuten Card';
  if (/三井住友|SMBC/.test(all)) return 'SMBC Card';
  if (/データ処理日/.test(hdr) && /会員/.test(hdr)) return 'Amex';                // Amex Japan layout
  if (/確定情報/.test(hdr) && /何回目/.test(hdr)) return 'JAL Card';               // NICOS layout (your JAL Mastercard)
  if (/ご利用店名及び商品名/.test(hdr) && /締前入金区分/.test(hdr)) return 'Takashimaya Card'; // Saison layout
  if (/利用店名・商品名/.test(hdr) && /支払方法/.test(hdr)) return 'Rakuten Card';
  if (named) return named;
  return fileName.replace(/\.[^.]+$/, '');
}
async function handleCsvFile(file) {
  const buf = await file.arrayBuffer();
  const { text, enc } = decodeFile(buf);
  const rows = parseCSV(text);
  if (!rows.length) { toast('That file looks empty.'); return; }
  const det = detectMapping(rows);
  if (!rows.some(r => parseDate(r[det.dateCol]))) { toast('No dates found — is this a statement CSV?'); return; }
  const sig = importSignature(rows, det), saved = S.importMaps[sig];
  UI.imp = { fileName: file.name, enc, rows, det, sig,
    map: saved ? { dateCol: saved.dateCol, descCol: saved.descCol, amountCol: saved.amountCol } : { dateCol: det.dateCol, descCol: det.descCol, amountCol: det.amountCol },
    mode: saved ? saved.mode : 'card', instMode: saved && saved.instMode || 'monthly', account: saved ? saved.account : detectCard(rows, det, file.name) };
  buildImportItems(); render();
}

  const res = { added: 0, updated: 0, removed: 0 };
  const newer = (inc.savedAt || 0) > (S.savedAt || 0);
  // deletions from both sides
  const del = Object.assign({}, inc.deleted || {}, S.deleted || {});
  for (const [id, t] of Object.entries(inc.deleted || {})) if (!S.deleted[id] || S.deleted[id] < t) del[id] = t;
  const byId = new Map(S.transactions.map(t => [t.id, t]));
  const ckey = t => [t.date, norm(t.desc), t.amount, t.type].join('|');
  const local = {}; for (const t of S.transactions) if (t.source !== 'manual') { const k = ckey(t); local[k] = (local[k] || 0) + 1; }
  const recKeys = new Set(S.transactions.filter(t => t.recId).map(t => t.recId + ':' + t.date.slice(0, 7)));
  for (const t of inc.transactions || []) {
    if (del[t.id] && del[t.id] >= (t.u || 0)) continue;
    const mine = byId.get(t.id);
    if (mine) { if ((t.u || 0) > (mine.u || 0)) { Object.assign(mine, t); res.updated++; } continue; }
    if (t.recId && recKeys.has(t.recId + ':' + t.date.slice(0, 7))) continue;            // same regular payment already added here
    if (t.source !== 'manual') { const k = ckey(t); if (local[k] > 0) { local[k]--; continue; } } // same statement row imported on both devices
    S.transactions.push(t); byId.set(t.id, t); res.added++;
  }
  const before = S.transactions.length;
  S.transactions = S.transactions.filter(t => !(del[t.id] && del[t.id] >= (t.u || 0)));
  res.removed = before - S.transactions.length;
  S.deleted = del;
  // lists with ids: union; when both have the same item, the newer file wins
  for (const k of ['categories', 'recurring', 'rules', 'contacts', 'debts']) {
    const map = new Map((S[k] || []).map(x => [x.id, x]));
    for (const x of inc[k] || []) if (!map.has(x.id) || newer) map.set(x.id, x);
    S[k] = [...map.values()];
  }
  for (const k of ['applied', 'importMaps', 'tripMeta', 'cards']) S[k] = newer ? Object.assign({}, S[k], inc[k]) : Object.assign({}, inc[k], S[k]);
  if (inc.bank && (!S.bank || (inc.bank.u || 0) > (S.bank.u || 0))) S.bank = inc.bank;
  if (newer && inc.settings) S.settings = Object.assign(S.settings, inc.settings, { lastBackup: S.settings.lastBackup });
  return res;
}
// On iPhone/iPad, hand the file to the Share sheet ("Save to Files" → iCloud Drive); elsewhere, download it.
function exportFile(name, text, type) {
  try {
    const f = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [f] }) && IS_IOS) { navigator.share({ files: [f] }).catch(() => {}); return; }
  } catch (e) {}
  download(name, text, type);
}

/* ---------- modal ---------- */
function showModal(html) { $('#modalBody').innerHTML = html; const d = $('#modal'); if (!d.open) d.showModal(); }
function closeModal() { const d = $('#modal'); if (d.open) d.close(); MODAL = null; }

function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok; }
}
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const cleanNum = n => String(n || '').normalize('NFKC').replace(/[^\d+]/g, '');
function smsHref(nums, body) {
  const to = nums.map(cleanNum).filter(Boolean).join(',');
  const b = encodeURIComponent(body);
  return IS_IOS ? `sms:/open?addresses=${to}&body=${b}` : `sms:${to}?body=${b}`;
}

    const I = UI.imp; let n = 0;

    let filled = 0;
    for (const x of I.items) if (x.dupOf && (x.postDate || x.billDate)) { const t = S.transactions.find(y => y.id === x.dupOf); if (t && ((x.postDate && !t.postDate) || (x.billDate && !t.billDate))) { if (x.postDate) t.postDate = x.postDate; if (x.billDate) t.billDate = x.billDate; t.u = now(); filled++; } }

      const pay = withBill.map(x => x.billDate).sort().pop(), lastBuy = withBill.map(x => x.date).sort().pop();
      const off = Math.max(1, (pay.slice(0, 4) - lastBuy.slice(0, 4)) * 12 + (pay.slice(5, 7) - lastBuy.slice(5, 7)));
      S.cards[acc] = { close: +lastBuy.slice(8, 10) >= 25 ? 31 : +lastBuy.slice(8, 10), pay: +pay.slice(8, 10), offset: off, guessed: true };
    }
    const months = [...new Set(I.items.filter(x => x.include).map(x => x.date.slice(0, 7)))].sort();
    save(); UI.imp = null; UI.view = 'overview'; if (months.length) UI.month = months[months.length - 1]; render(); toast(`Imported ${n} entries`);

    const r = mergeState(data); save(); applyRecurring(); render();
    toast(`Merged · ${r.added} new, ${r.updated} updated, ${r.removed} removed`);

});
